services:
  prepare:
    image: alpine:3.23.3
    volumes:
      - .:/experiment:rw
    entrypoint: /bin/sh -c
    command:
      - |
        mkdir -p /experiment/data
        chmod 777 /experiment/data
        mkdir -p /experiment/charts
        chmod 777 /experiment/charts

  fixed-sensors-leader-based:
    depends_on:
      prepare:
        condition: service_completed_successfully
    image: angelacortecchia/experiments-coordination-self-stabilizing-gossip:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    volumes:
      - ./data:/experiment/data
    environment:
      - MAX_SEED=100
      - GRADLE_TASK=runFixedSensorsLBBatch

  fixed-sensors-neighbors-based:
    depends_on:
      prepare:
        condition: service_completed_successfully
    image: angelacortecchia/experiments-coordination-self-stabilizing-gossip:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    volumes:
      - ./data:/experiment/data
    environment:
      - MAX_SEED=100
      - GRADLE_TASK=runFixedSensorsNBBatch

  moving-sensors-neighbors-based:
    depends_on:
      prepare:
        condition: service_completed_successfully
    image: angelacortecchia/experiments-coordination-self-stabilizing-gossip:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    volumes:
      - ./data:/experiment/data
    environment:
      - MAX_SEED=100
      - GRADLE_TASK=runMovingSensorsNBBatch

  charts:
    depends_on:
      prepare:
        condition: service_completed_successfully
      fixed-sensors-leader-based:
        condition: service_completed_successfully
      moving-sensors-neighbors-based:
        condition: service_completed_successfully
      fixed-sensors-neighbors-based:
        condition: service_completed_successfully
    image: angelacortecchia/${PROJECT_NAME:-unknown}-charts:${VERSION:-latest}
    build:
      dockerfile: ./docker/charts/Dockerfile
      context: .
    volumes:
      - ./data:/experiment/data
      - ./charts:/experiment/charts

  finish:
    depends_on:
      charts:
        condition: service_completed_successfully
      prepare:
        condition: service_completed_successfully
    image: alpine:3.23.3
    volumes:
      - .:/experiment:rw
    entrypoint: /bin/sh -c
    command:
      - |
        find /experiment/data -type d -exec chmod 777 {} \;
        find /experiment/charts -type d -exec chmod 777 {} \;
        find /experiment/data -type f -exec chmod 666 {} \;
        find /experiment/charts -type f -exec chmod 666 {} \;