incarnation: collektive

variables:
  numberOfParticles: &numberOfParticles 250
  maxInitialSpeed: &maxInitialSpeed 2.0
  neighboringDistance: &neighboringDistance 40.0
  numberOfNeighbors: &numberOfNeighbors 0
  stepLength: &stepLength 30
  dataPath: &dataPath "data/oneFixedSensorOneZebraLB/"
  startX: &startX -70
  endX: &endX 50
  startY: &startY -10
  endY: &endY 100
  size: &size 120
  seed: &seed
    min: 0
    max: 5
    step: 1
    default: 42

network-model:
  type: ConnectWithinDistance
  parameters: [*neighboringDistance]

_movementZebra35: &movementZebra35
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_035.csv"

_movementZebra37: &movementZebra37
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_037.csv"

_movementZebra38: &movementZebra38
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_038.csv"

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.AggregateInformationAgentLeaderBasedKt.informationFilterEntrypointLeaderBased ]

deployments:
  - type: Point
    parameters: [ 0, 0 ]
    programs:
      - *movementZebra35
  - type: Point
    parameters: [ 0, 0 ]
    programs:
      - *movementZebra37
  - type: Point
    parameters: [ 0, 0 ]
    programs:
      - *movementZebra38
#  - type: Point
#    parameters: [15, 15]
  - type: Grid
    parameters: [ *startX, *startY, *endX, *endY, *stepLength, *stepLength, 2, 2 ]
    contents:
      - molecule: Filter
        concentration: true
      - molecule: NumberOfParticles
        concentration: *numberOfParticles
      - molecule: MaxInitialSpeed
        concentration: *maxInitialSpeed
      - molecule: SideLength
        concentration: *size
      - molecule: NumberOfNeighbors
        concentration: *numberOfNeighbors
      - molecule: isDown
        concentration: false
    programs: *program
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty
#        parameters: [ *measurementStdDev ]

launcher:
  parameters:
    batch: [ seed ]
    showProgress: true
    autoStart: true

monitors:
  - type: it.unibo.alchemist.model.monitors.ExportEstimations
    parameters: [*seed, *numberOfNeighbors, *dataPath]
#  - type: it.unibo.alchemist.model.monitors.ExportSensorsDeployment
#    parameters: [*seed, *numberOfNeighbors, *dataPath]

terminate:
  type: AfterTime
  parameters: 1400.0