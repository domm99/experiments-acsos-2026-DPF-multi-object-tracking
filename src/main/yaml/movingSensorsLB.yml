incarnation: collektive

variables:
  numberOfParticles: &numberOfParticles 250
  formationRows: &formationRows
    type: ArbitraryVariable
    parameters: [ 4, [4] ]
  formationCols: &formationColumns
    type: ArbitraryVariable
    parameters: [ 6, [6] ]
  formationSpacing: &formationSpacing
    type: ArbitraryVariable
    parameters: [ 30, [30] ]
  leaderElectionSwitchMargin: &leaderElectionSwitchMargin
    language: kotlin
    formula: |
      (formationSpacing as Int).toDouble() / 4.0
  swarmStepSize: &swarmStepSize 10.0
  swarmWarmupRounds: &swarmWarmupRounds 5
  maxInitialSpeed: &maxInitialSpeed 2.0
  neighboringDistance: &neighboringDistance 40.0
  numberOfNeighbors: &numberOfNeighbors 0
  gridCenterX: &gridCenterX
    type: ArbitraryVariable
    parameters: [ 0.0, [0.0] ]
  gridCenterY: &gridCenterY
    type: ArbitraryVariable
    parameters: [ 0.0, [0.0] ]
  gridStartX: &gridStartX
    language: kotlin
    formula: |
      gridCenterX as Double - (formationCols as Int - 1) * (formationSpacing as Int) / 2.0
  gridStartY: &gridStartY
    language: kotlin
    formula: |
      gridCenterY as Double - (formationRows as Int - 1) * (formationSpacing as Int) / 2.0
  gridEndX: &gridEndX
    language: kotlin
    formula: |
      (gridStartX as Double) + (formationCols as Int) * (formationSpacing as Int)
  gridEndY: &gridEndY
    language: kotlin
    formula: |
      (gridStartY as Double) + (formationRows as Int) * (formationSpacing as Int)
  particleInitMinX: &particleInitMinX
    language: kotlin
    formula: |
      gridCenterX as Double - (size as Int) / 2.0
  particleInitMaxX: &particleInitMaxX
    language: kotlin
    formula: |
      gridCenterX as Double + (size as Int) / 2.0
  particleInitMinY: &particleInitMinY
    language: kotlin
    formula: |
      gridCenterY as Double - (size as Int) / 2.0
  particleInitMaxY: &particleInitMaxY
    language: kotlin
    formula: |
      gridCenterY as Double + (size as Int) / 2.0
  dataPath: &dataPath "data/movingSensorsLB/"
  size: &size
    language: kotlin
    formula: |
      val width = kotlin.math.abs((gridEndX as Double) - (gridStartX as Double))
      val height = kotlin.math.abs((gridEndY as Double) - (gridStartY as Double))
      (if (width >= height) width else height).toInt()
  seed: &seed
    min: 0
    max: 5
    step: 1
    default: 42

network-model:
  type: ConnectWithinDistance
  parameters: [*neighboringDistance]

_movementZebra35: &movementZebra35
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_035.csv"

_movementZebra37: &movementZebra37
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_037.csv"

_movementZebra38: &movementZebra38
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_038.csv"

_sensorMovement: &sensorMovement
  - time-distribution: 2
    type: Event
    actions:
      - type: MoveSensorsInSwarm
        parameters:
          - *formationRows # number of rows in the grid of sensors
          - *formationColumns # number of columns in the grid of sensors
          - *formationSpacing # spacing

environment:
  type: Continuous2DEnvironment
  parameters: [ ]
  global-programs:
    - time-distribution:
        type: Trigger
        parameters: [ 700 ]
      type: KillLeader

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.AggregateInformationAgentLeaderBasedKt.entrypointMovingSensorsLeaderBased ]

deployments:
  - type: Point
    parameters: [ *gridCenterX, *gridCenterY ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra35
  - type: Point
    parameters: [ *gridCenterX, *gridCenterY ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra37
  - type: Point
    parameters: [ *gridCenterX, *gridCenterY ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra38
  - type: Grid
    parameters:
      - *gridStartX
      - *gridStartY
      - *gridEndX
      - *gridEndY
      - *formationSpacing
      - *formationSpacing
      - 1
      - 1
    contents:
      - molecule: Filter
        concentration: true
      - molecule: NumberOfParticles
        concentration: *numberOfParticles
      - molecule: MaxInitialSpeed
        concentration: *maxInitialSpeed
      - molecule: SideLength
        concentration: *size
      - molecule: InitialParticlesMinX
        concentration: *particleInitMinX
      - molecule: InitialParticlesMaxX
        concentration: *particleInitMaxX
      - molecule: InitialParticlesMinY
        concentration: *particleInitMinY
      - molecule: InitialParticlesMaxY
        concentration: *particleInitMaxY
      - molecule: isDown
        concentration: false
      - molecule: FormationRows
        concentration: *formationRows
      - molecule: FormationColumns
        concentration: *formationColumns
      - molecule: FormationSpacing
        concentration: *formationSpacing
      - molecule: LeaderElectionSwitchMargin
        concentration: *leaderElectionSwitchMargin
      - molecule: SwarmStepSize
        concentration: *swarmStepSize
      - molecule: SwarmWarmupRounds
        concentration: *swarmWarmupRounds
    programs: [*program, *sensorMovement]
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty

launcher:
  parameters:
    batch: [ seed, numberOfNeighbors ]
    showProgress: true
    autoStart: true

monitors:
  - type: it.unibo.alchemist.model.monitors.ExportEstimations
    parameters: [*seed, *numberOfNeighbors, *dataPath]

terminate:
  type: AfterTime
  parameters: 1400.0
