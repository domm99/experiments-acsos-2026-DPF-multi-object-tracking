incarnation: collektive

variables:
  numberOfParticles: &numberOfParticles 250
  maxInitialSpeed: &maxInitialSpeed 2.0
  neighboringDistance: &neighboringDistance 250.0
  numberOfNeighbors: &numberOfNeighbors
    type: ArbitraryVariable
    parameters: [ 5, [0, 1, 2, 4, 7] ]
  stepLength: &stepLength 30
  dataPath: &dataPath "data/movingSensorsNB/"
  size: &size 150
  seed: &seed
    min: 0
    max: 5
    step: 1
    default: 42

network-model:
  type: ConnectWithinDistance
  parameters: [*neighboringDistance]

_movementZebra35: &movementZebra35
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_035.csv"

_movementZebra37: &movementZebra37
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_037.csv"

_movementZebra38: &movementZebra38
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_038.csv"

_sensorMovement: &sensorMovement
  - time-distribution: 2
    type: Event
    actions:
      - type: MoveSensorsInSwarm
        parameters:
          - 4 # number of rows in the grid of sensors
          - 6 # number of columns in the grid of sensors
          - *stepLength # spacing

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.AggregateInformationAgentKt.informationFilterAndDistributedMovementEntrypoint ]

deployments:
  - type: Point
    parameters: [ 0, 0 ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra35
  - type: Point
    parameters: [ 0, 0 ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra37
  - type: Point
    parameters: [ 0, 0 ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra38
#  - type: Point
#    parameters: [15, 15]
  - type: Grid
    parameters: [ -70, -10, 100, 100, *stepLength, *stepLength, 1, 1 ]
    contents:
      - molecule: Filter
        concentration: true
      - molecule: NumberOfParticles
        concentration: *numberOfParticles
      - molecule: MaxInitialSpeed
        concentration: *maxInitialSpeed
      - molecule: SideLength
        concentration: *size
      - molecule: NumberOfNeighbors
        concentration: *numberOfNeighbors
      - molecule: isDown
        concentration: false
      - molecule: FormationRows
        concentration: 4
      - molecule: FormationColumns
        concentration: 6
      - molecule: FormationSpacing
        concentration: *stepLength
      - molecule: SwarmStepSize
        concentration: 2.0
    programs: [*program, *sensorMovement]
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty

launcher:
  parameters:
    batch: [ seed, numberOfNeighbors ]
    showProgress: true
    autoStart: true

monitors:
  - type: it.unibo.alchemist.model.monitors.ExportEstimations
    parameters: [*seed, *numberOfNeighbors, *dataPath]

terminate:
  type: AfterTime
  parameters: 1400.0
