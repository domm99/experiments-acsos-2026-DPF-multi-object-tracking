incarnation: collektive

_constants:
  sideLength: &sideLength 100.0
  numberOfParticles: &numberOfParticles 500
  maxInitialSpeed: &maxInitialSpeed 2.0
  blindSpotDistance: &blindSpotDistance 5.0

network-model:
  type: ConnectWithinDistance
  parameters: [15]

monitors:
  - type: it.unibo.alchemist.model.monitors.ExportEstimations

_movement: &movement
  - time-distribution:
      type: DiracComb
      parameters: [ 0.1, 1 ]
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - 0.05
          - 0.03
          - *sideLength
          - 0.001

_particleFilter: &particleFilter
  - time-distribution:
      type: DiracComb
      parameters: [ 0.4, 1 ]
    type: Event
    actions:
      - type: CentralizedParticleFilter
        parameters:
          - *sideLength
          - *numberOfParticles
          - *maxInitialSpeed
          - *blindSpotDistance

deployments:
  - type: Point
    parameters: [ 10, 10 ]
    contents:
      - molecule: Filter
        concentration: true
    programs:
      - *particleFilter

  - type: Point
    parameters: [ 0, 0 ]
    contents:
      - molecule: Movable
        concentration: true
    programs:
      - *movement

export:
  - type: CSVExporter
    parameters:
      fileNameRoot: "experiment"
      interval: 1.0
      exportPath: "data"
    data:
      - time
      - molecule: PositionX
        aggregators: [mean]
        value-filter: onlyFinite
        precision: 3
      - molecule: PositionY
        aggregators: [mean]
        value-filter: onlyfinite

terminate:
  type: AfterTime
  parameters: 30.0