incarnation: collektive

variables:
  numberOfParticles: &numberOfParticles 250
  formationRows: &formationRows
    type: ArbitraryVariable
    parameters: [ 4, [4] ]
  formationCols: &formationColumns
    type: ArbitraryVariable
    parameters: [ 6, [6] ]
  formationSpacing: &formationSpacing
    type: ArbitraryVariable
    parameters: [ 30, [30] ]
  maxInitialSpeed: &maxInitialSpeed 2.0
  neighboringDistance: &neighboringDistance 250.0
  numberOfNeighbors: &numberOfNeighbors
    type: ArbitraryVariable
    parameters: [ 5, [0, 1, 2, 4, 7] ]
  # For fixed sensors we keep the grid horizontally centered and anchor the
  # lower long side close to the movables' starting axis.
  gridCenterX: &gridCenterX
    type: ArbitraryVariable
    parameters: [ 0.0, [0.0] ]
  gridBottomY: &gridBottomY
    type: ArbitraryVariable
    parameters: [ -10.0, [-10.0] ]
  gridStartX: &gridStartX
    language: kotlin
    formula: |
      gridCenterX as Double - (formationCols as Int - 1) * (formationSpacing as Int) / 2.0
  gridStartY: &gridStartY
    language: kotlin
    formula: |
      gridBottomY as Double
  gridEndX: &gridEndX
    language: kotlin
    formula: |
      (gridStartX as Double) + (formationCols as Int) * (formationSpacing as Int)
  gridEndY: &gridEndY
    language: kotlin
    formula: |
      (gridStartY as Double) + (formationRows as Int) * (formationSpacing as Int)
  particleInitExtraTopY: &particleInitExtraTopY
    type: ArbitraryVariable
    parameters: [ 10.0, [10.0] ]
  clampParticlesToInitializationArea: &clampParticlesToInitializationArea true
  particleInitMinX: &particleInitMinX
    language: kotlin
    formula: |
      gridStartX as Double
  particleInitMaxX: &particleInitMaxX
    language: kotlin
    formula: |
      (gridStartX as Double) + (formationCols as Int - 1) * (formationSpacing as Int)
  particleInitMinY: &particleInitMinY
    language: kotlin
    formula: |
      gridStartY as Double
  particleInitMaxY: &particleInitMaxY
    language: kotlin
    formula: |
      (gridStartY as Double) + (formationRows as Int - 1) * (formationSpacing as Int) + (particleInitExtraTopY as Double)
  gridJitterX: &gridJitterX 1
  gridJitterY: &gridJitterY 1
  dataPath: &dataPath "data/fixedSensorsNB/"
  size: &size
    language: kotlin
    formula: |
      val width = kotlin.math.abs((gridEndX as Double) - (gridStartX as Double))
      val height = kotlin.math.abs((gridEndY as Double) - (gridStartY as Double))
      (if (width >= height) width else height).toInt()
  seed: &seed
    min: 0
    max: 50
    step: 1
    default: 42

network-model:
  type: ConnectWithinDistance
  parameters: [*neighboringDistance]

_movementZebra35: &movementZebra35
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_035.csv"

_movementZebra37: &movementZebra37
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_037.csv"

_movementZebra38: &movementZebra38
  - time-distribution: 1
    type: Event
    actions:
      - type: MoveNode
        parameters:
          - "zebras-trajectories/flights/flight_1_zebras/zebra_038.csv"

_pool: &program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [ it.unibo.collektive.AggregateInformationAgentKt.informationFilterEntrypoint ]

deployments:
  - type: Point
    parameters: [ 0, 0 ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra35
  - type: Point
    parameters: [ 0, 0 ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra37
  - type: Point
    parameters: [ 0, 0 ]
    contents:
      - molecule: Zebra
        concentration: true
    programs:
      - *movementZebra38
  - type: Grid
    parameters:
      - *gridStartX
      - *gridStartY
      - *gridEndX
      - *gridEndY
      - *formationSpacing
      - *formationSpacing
      - *gridJitterX
      - *gridJitterY
    contents:
      - molecule: Filter
        concentration: true
      - molecule: NumberOfParticles
        concentration: *numberOfParticles
      - molecule: MaxInitialSpeed
        concentration: *maxInitialSpeed
      - molecule: SideLength
        concentration: *size
      - molecule: InitialParticlesMinX
        concentration: *particleInitMinX
      - molecule: InitialParticlesMaxX
        concentration: *particleInitMaxX
      - molecule: InitialParticlesMinY
        concentration: *particleInitMinY
      - molecule: InitialParticlesMaxY
        concentration: *particleInitMaxY
      - molecule: ClampParticlesToInitializationArea
        concentration: *clampParticlesToInitializationArea
      - molecule: NumberOfNeighbors
        concentration: *numberOfNeighbors
      - molecule: isDown
        concentration: false
      - molecule: ErrorOnDesiredPosition
        concentration: 0.0
    programs: [ *program ]
    properties:
      - type: it.unibo.collektive.alchemist.device.sensors.impl.LocationSensorProperty

launcher:
  parameters:
    batch: [ seed, numberOfNeighbors ]
    showProgress: true
    autoStart: true

monitors:
  - type: it.unibo.alchemist.model.monitors.ExportEstimations
    parameters: [*seed, *numberOfNeighbors, 0.0, *dataPath]

terminate:
  type: AfterTime
  parameters: 1400.0
